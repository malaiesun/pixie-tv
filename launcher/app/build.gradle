plugins { id 'com.android.application' }

android {
    namespace 'dev.malaiesun.home'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.malaiesun.home'
        minSdk 29
        targetSdk 34
        versionCode 8
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug   // personal device: debug key, stable on this PC
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'   // JVM tests for the rule engine only
}
